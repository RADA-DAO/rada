name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: 2.9.7
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
      - name: Validate local Compose without starting services
        run: docker compose --env-file .env.example -f infra/compose/local.yaml config --quiet
      - name: Scan tracked files and history for secrets
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scan_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scan_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git . --redact --no-banner
          source_dir="$(mktemp -d)"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$source_dir"
          "$scan_dir/gitleaks" dir "$source_dir" --redact --no-banner
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_DB: rada_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rada_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: rada_test
      PGPASSWORD: fixture-password
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: 2.9.7
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run test:db
      - run: npm run test:api:db
        env:
          API_TEST_DATABASE_URL: postgresql://postgres:fixture-password@localhost:5432/rada_test
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, Python-2.0, CC0-1.0
  e2e-pending:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'PENDING - implement application flows before enabling this job'
