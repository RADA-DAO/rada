name: rada-local
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set a disposable local database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set a disposable local user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a disposable local password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
networks:
  private:
    internal: true
volumes:
  postgres-data:
