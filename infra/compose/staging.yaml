name: rada-staging
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: rada_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set migration administrator password}
    volumes:
      - staging-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d rada_staging"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    profiles: [tools]
    build:
      context: ../..
      dockerfile: infra/compose/migrate.Dockerfile
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: rada_staging
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set migration administrator password}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set separate auth login password}
      SERVICE_PASSWORD: ${SERVICE_PASSWORD:?Set separate service login password}
      WALLET_PASSWORD: ${WALLET_PASSWORD:?Set separate wallet login password}
      OPS_PASSWORD: ${OPS_PASSWORD:?Set separate ops login password}
      STAGING_AUTH_MODE: ${STAGING_AUTH_MODE:-allowlist}
      STAGING_SYNTHETIC_ONLY: ${STAGING_SYNTHETIC_ONLY:-false}
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:?Set exact Worker HTTPS origin}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set separate staging bot token}
      IDENTITY_AUTH_DATABASE_URL: postgresql://staging_auth:${AUTH_PASSWORD:?Set auth password}@postgres:5432/rada_staging
      IDENTITY_SERVICE_DATABASE_URL: postgresql://staging_service:${SERVICE_PASSWORD:?Set service password}@postgres:5432/rada_staging
      WALLET_SERVICE_DATABASE_URL: postgresql://staging_wallet:${WALLET_PASSWORD:?Set wallet password}@postgres:5432/rada_staging
      CLIENT_ERRORS_DATABASE_URL: postgresql://staging_ops:${OPS_PASSWORD:?Set ops password}@postgres:5432/rada_staging
      WALLET_APP_ORIGIN: ${WALLET_APP_ORIGIN:?Set exact Worker HTTPS origin for proofs}
      STAGING_RUNTIME: "true"
      STAGING_AUTH_MODE: ${STAGING_AUTH_MODE:-allowlist}
      STAGING_SYNTHETIC_ONLY: ${STAGING_SYNTHETIC_ONLY:-false}
      STAGING_ALLOWED_TELEGRAM_IDS: ${STAGING_ALLOWED_TELEGRAM_IDS-}
      API_OPS_TOKEN: ${API_OPS_TOKEN-}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-false}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID-}
    healthcheck:
      test:
        [
          CMD,
          deno,
          eval,
          'const r = await fetch("http://127.0.0.1:8000/health"); if (!r.ok) Deno.exit(1);',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [database, origin, egress]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  caddy:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    environment:
      STAGING_API_HOSTNAME: ${STAGING_API_HOSTNAME:?Set staging API HTTPS hostname}
    entrypoint: [sh, /etc/caddy/caddy-entrypoint.sh]
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-entrypoint.sh:/etc/caddy/caddy-entrypoint.sh:ro
      - staging-caddy-data:/data
      - staging-caddy-config:/config
    networks: [origin, egress]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
networks:
  database:
    internal: true
  origin:
    internal: true
  egress:
volumes:
  staging-data:
  staging-caddy-data:
  staging-caddy-config:
